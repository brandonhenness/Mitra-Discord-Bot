name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.2.0 or 0.2.0rc1 (run from the default branch)"
        required: true
        type: string
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: mitra-release
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Prepare consistent release version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            uv run --no-sync python -m mitra_bot.release_tools stamp "$RELEASE_VERSION"
          else
            uv run --no-sync python -m mitra_bot.release_tools check "$RELEASE_VERSION"
          fi
          uv lock --check
      - name: Test without Discord credentials or hardware actions
        run: uv run --no-sync python -m pytest -q -m "not integration" --basetemp=.recovery/ci-release --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Prepare identical tested version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            uv run --no-sync python -m mitra_bot.release_tools stamp "$RELEASE_VERSION"
          else
            uv run --no-sync python -m mitra_bot.release_tools check "$RELEASE_VERSION"
          fi
          uv lock --check
      - name: Build wheel, source distribution and deployment ZIP
        run: |
          uv build
          uv run --no-sync python -m mitra_bot.release_tools bundle
          uv run --no-sync python -m mitra_bot.release_tools checksums
      - name: Smoke-test installed wheel entry points
        shell: bash
        run: |
          uv venv .wheel-test
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .wheel-test/constraints.txt --quiet
          uv pip install --python .wheel-test/bin/python --constraint .wheel-test/constraints.txt dist/*.whl
          cd .wheel-test
          bin/python -m mitra_bot.setup_wizard --help
          bin/python -m mitra_bot.init_peers --help
          bin/python -m mitra_bot.cloudflare_setup --help
      - name: Publish versioned tag and release assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run --no-sync python -m mitra_bot.release_tools publish
